spring.application.name=Caritfy

spring.datasource.url=jdbc:postgresql://localhost:5432/cartify
spring.datasource.username=postgres
spring.datasource.password=root

# Automatically creates/updates tables from your JPA entities during development
spring.jpa.hibernate.ddl-auto=update

# Prints generated SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true